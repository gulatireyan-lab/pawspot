<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in — PawSpot</title><script src="https://cdn.tailwindcss.com"></script></head><body class="min-h-screen bg-orange-50 flex items-center justify-center p-5"><div class="bg-white rounded-3xl shadow-xl p-8 w-full max-w-md"><a href="/" class="font-black text-2xl">🐾 PawSpot</a><h1 class="text-3xl font-black mt-8">Welcome back</h1><p class="text-gray-500 mt-2">Sign in with an email code. No password needed.</p><form id="f" class="mt-7 space-y-4"><input id="email" type="email" required placeholder="you@example.com" class="w-full border rounded-2xl px-4 py-4"><input id="code" inputmode="numeric" placeholder="6-digit code" class="w-full border rounded-2xl px-4 py-4 hidden"><button class="w-full bg-orange-500 text-white rounded-2xl py-4 font-bold" id="b">Send code</button></form><p id="msg" class="text-sm text-gray-500 mt-4"></p></div><script>const A=window.hatchable.auth;let sent=false;document.querySelector('#f').onsubmit=async e=>{e.preventDefault();const email=document.querySelector('#email').value,msg=document.querySelector('#msg'),b=document.querySelector('#b');try{if(!sent){await A.startLogin({email});sent=true;document.querySelector('#code').classList.remove('hidden');b.textContent='Sign in';msg.textContent='Check your email for the 6-digit code.'}else{await A.verifyCode({email,code:document.querySelector('#code').value});const n=new URLSearchParams(location.search).get('next');location.href=n&&n.startsWith('/')?n:'/';}}catch(x){msg.textContent=x.message||'Something went wrong. Please try again.'}}</script></body></html>
