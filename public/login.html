<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in — PawSpot</title>
<meta name="robots" content="noindex,nofollow">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,sans-serif;background:linear-gradient(135deg,#fff7ef,#fff,#fff1e8);display:flex;align-items:center;justify-content:center;color:#202020;padding:20px}
.wrap{width:100%;max-width:430px}.brand{text-align:center;font-size:28px;font-weight:900;margin-bottom:18px}.brand span{color:#ff6b35}
.card{background:#fff;border:1px solid #eee5dc;border-radius:28px;box-shadow:0 18px 55px rgba(70,45,20,.12);padding:32px}
h1{font-size:28px;margin:0 0 8px;font-weight:900}.sub{color:#6b7280;margin:0 0 24px;line-height:1.5}
input,button{width:100%;height:50px;border-radius:15px;font:inherit}input{border:1px solid #ddd3ca;padding:0 15px;outline:none}input:focus{border-color:#ff6b35;box-shadow:0 0 0 3px rgba(255,107,53,.12)}
button{border:0;background:#ff6b35;color:#fff;font-weight:800;cursor:pointer;margin-top:12px}button:disabled{opacity:.55;cursor:not-allowed}.back{background:#fff;color:#555;border:1px solid #e4d9d0}.msg{min-height:22px;margin:15px 0 0;font-size:14px;color:#666}.err{color:#c2410c}.home{display:block;text-align:center;color:#ff6b35;font-weight:700;text-decoration:none;margin-top:20px;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><span>🐾</span> PawSpot</div>
  <div class="card">
    <h1 id="title">Welcome back</h1>
    <p class="sub" id="sub">Sign in with your email. We'll send you a one-time code — no password needed.</p>
    <form id="form">
      <input id="email" type="email" autocomplete="username webauthn" placeholder="you@example.com" required>
      <input id="code" type="text" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code" hidden>
      <button id="submit" type="submit">Continue</button>
      <button id="back" class="back" type="button" hidden>Use a different email</button>
    </form>
    <div id="msg" class="msg" role="status" aria-live="polite"></div>
    <a class="home" href="/">← Back to PawSpot</a>
  </div>
</div>
<script>
(function(){
  const A=window.hatchable&&window.hatchable.auth;
  const form=document.getElementById('form'),email=document.getElementById('email'),code=document.getElementById('code');
  const submit=document.getElementById('submit'),back=document.getElementById('back'),msg=document.getElementById('msg');
  const title=document.getElementById('title'),sub=document.getElementById('sub');
  let step='email';
  function say(t,err){msg.textContent=t||'';msg.className='msg'+(err?' err':'')}
  function next(){const raw=new URLSearchParams(location.search).get('next')||'/';return raw.startsWith('/')&&!raw.startsWith('//')?raw:'/'}
  if(!A){say('Sign-in is temporarily unavailable. Please refresh.',true);submit.disabled=true;return}
  A.getSession().then(s=>{if(s&&s.user)location.replace(next())}).catch(()=>{});
  form.addEventListener('submit',async e=>{
    e.preventDefault();submit.disabled=true;say('');
    try{
      if(step==='email'){
        const value=email.value.trim();
        if(!value){say('Enter your email address.',true);submit.disabled=false;return}
        await A.startLogin({email:value});
        step='code';email.hidden=true;code.hidden=false;back.hidden=false;submit.textContent='Sign in';
        title.textContent='Check your email';sub.textContent='Enter the 6-digit code we sent to '+value+'.';code.focus();say('Code sent. It expires in 10 minutes.');
      }else{
        const d=await A.verifyCode({email:email.value.trim(),code:code.value.trim()});
        if(d&&d.user){location.replace(next())}else say('That code did not work. Try again.',true);
      }
    }catch(err){say(err&&err.message?err.message:'Something went wrong. Please try again.',true)}
    submit.disabled=false;
  });
  back.onclick=()=>{step='email';email.hidden=false;code.hidden=true;back.hidden=true;submit.textContent='Continue';title.textContent='Welcome back';sub.textContent="Sign in with your email. We'll send you a one-time code — no password needed.";say('');email.focus()}
  email.focus();
})();
</script>
</body>
</html>
